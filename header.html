<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />
  <title>Creative Agency — Navbar</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />
  <style>
    /* ============================================================
       STACKLY CREATIVE AGENCY — LIGHT NAVBAR
       Page     #FAF7F2  (warm paper)
       Navbar   #FFFFFF  (pure white)
       Text     #1A1625  (deep ink — used for text AND icons)
       Accent   #7C3AED  (electric violet)
       Accent s #A78BFA  (soft violet)
       Border   #EBE6DD  (warm hairline)
       ============================================================ */
    :root {
      --paper: #faf7f2;
      --white: #ffffff;
      --ink: #1a1625;
      --violet: #7c3aed;
      --violet-soft: #a78bfa;
      --border: #ebe6dd;
      --nav-height: 110px;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', Roboto, 'Helvetica Neue', system-ui, sans-serif;
    }

    body {
      background: var(--paper);
      color: var(--ink);
      padding-top: var(--nav-height);
    }

    /* ===== NAVBAR ===== */
    .navbar {
      background: var(--white);
      border-bottom: 1px solid var(--border);
      box-shadow: 0 2px 16px rgba(26, 22, 37, 0.04);
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 1000;
      width: 100%;
    }

    .nav-container {
      max-width: 1400px;
      margin: 0 auto;
      padding: 0 32px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: var(--nav-height);
      gap: 20px;
      width: 100%;
    }

    /* ===== LOGO ===== */
    .logo-section {
      display: flex;
      align-items: center;
      text-decoration: none;
      cursor: pointer;
      flex-shrink: 0;
      transition: opacity 0.25s ease;
    }

    .logo-section:hover {
      opacity: 0.85;
    }

    .logo-img {
      height: 70px;
      width: auto;
      object-fit: contain;
      display: block;
    }

    /* ===== NAV LINKS ===== */
    .nav-links {
      display: flex;
      align-items: center;
      gap: 32px;
      flex: 1;
      justify-content: center;
      flex-wrap: nowrap;
    }

    .nav-link {
      position: relative;
      background: none;
      border: none;
      padding: 0 0 6px 0;
      font-size: 0.95rem;
      font-weight: 600;
      color: var(--ink);
      cursor: pointer;
      transition: color 0.25s ease, transform 0.25s ease;
      font-family: inherit;
      white-space: nowrap;
      letter-spacing: 0.3px;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      text-decoration: none;
    }

    /* violet underline slides in */
    .nav-link::after {
      content: '';
      position: absolute;
      left: 0;
      bottom: 0;
      height: 2px;
      width: 0;
      border-radius: 2px;
      background: var(--violet);
      transition: width 0.3s ease;
    }

    /* icons = black, same as text */
    .nav-link i {
      color: var(--ink);
      font-size: 0.9rem;
      transition: color 0.25s ease;
    }

    .nav-link:hover {
      color: var(--violet);
      transform: translateY(-1px);
    }

    .nav-link:hover::after {
      width: 100%;
    }

    .nav-link:hover i {
      color: var(--violet);
    }

    /* ===== RIGHT ACTIONS ===== */
    .right-actions {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-shrink: 0;
    }

    .action-link {
      background: transparent;
      border: 1.5px solid var(--ink);
      padding: 0.55rem 1.5rem;
      border-radius: 8px;
      font-weight: 600;
      font-size: 0.9rem;
      color: var(--ink);
      cursor: pointer;
      transition: all 0.25s ease;
      font-family: inherit;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      white-space: nowrap;
      text-decoration: none;
    }

    .action-link i {
      font-size: 0.9rem;
      color: currentColor;
    }

    /* Sign In — outlined, fills violet */
    .action-link.signin-link:hover {
      background: var(--violet);
      border-color: var(--violet);
      color: #ffffff;
      transform: translateY(-1px);
    }

    /* Login — filled ink, flips to violet */
    .action-link.login-link {
      background: var(--ink);
      border-color: var(--ink);
      color: #ffffff;
      font-weight: 700;
    }

    .action-link.login-link:hover {
      background: var(--violet);
      border-color: var(--violet);
      color: #ffffff;
      box-shadow: 0 6px 20px rgba(124, 58, 237, 0.28);
      transform: translateY(-1px);
    }

    /* ===== HAMBURGER ===== */
    .hamburger {
      display: none;
      flex-direction: column;
      cursor: pointer;
      gap: 6px;
      padding: 8px;
      background: transparent;
      border: none;
      z-index: 1001;
    }

    .hamburger span {
      width: 28px;
      height: 2.5px;
      background: var(--ink);
      border-radius: 4px;
      transition: all 0.3s ease;
    }

    .hamburger:hover span {
      background: var(--violet);
    }

    .hamburger.active span:nth-child(1) {
      transform: rotate(45deg) translate(8px, 8px);
      background: var(--violet);
    }

    .hamburger.active span:nth-child(2) {
      opacity: 0;
    }

    .hamburger.active span:nth-child(3) {
      transform: rotate(-45deg) translate(7px, -7px);
      background: var(--violet);
    }

    /* ===== MOBILE MENU ===== */
    .mobile-menu {
      position: fixed;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100vh;
      background: var(--white);
      z-index: 999;
      transition: left 0.4s ease-in-out;
      overflow-y: auto;
      padding-top: 130px;
      border-right: 4px solid var(--violet);
    }

    .mobile-menu.active {
      left: 0;
    }

    .mobile-nav-links {
      display: flex;
      flex-direction: column;
      padding: 20px 30px;
      gap: 4px;
    }

    .mobile-nav-link {
      background: none;
      border: none;
      padding: 16px 0;
      font-size: 1.15rem;
      font-weight: 600;
      color: var(--ink);
      cursor: pointer;
      transition: all 0.25s ease;
      text-align: left;
      font-family: inherit;
      display: flex;
      align-items: center;
      gap: 16px;
      border-bottom: 1px solid var(--border);
      width: 100%;
      text-decoration: none;
    }

    /* mobile icons = black, same as text */
    .mobile-nav-link i {
      width: 30px;
      color: var(--ink);
      font-size: 1.05rem;
      transition: color 0.25s ease;
    }

    .mobile-nav-link:hover {
      color: var(--violet);
      transform: translateX(8px);
    }

    .mobile-nav-link:hover i {
      color: var(--violet);
    }

    .mobile-actions {
      display: flex;
      flex-direction: column;
      gap: 12px;
      padding: 24px 30px;
      margin-top: 20px;
      border-top: 1px solid var(--border);
    }

    .mobile-action-link {
      background: transparent;
      border: 1.5px solid var(--ink);
      padding: 14px 0;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 600;
      color: var(--ink);
      cursor: pointer;
      transition: all 0.25s ease;
      font-family: inherit;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      width: 100%;
      text-decoration: none;
    }

    .mobile-action-link.login-mobile {
      background: var(--ink);
      border-color: var(--ink);
      color: #ffffff;
      font-weight: 700;
    }

    .mobile-action-link:hover {
      background: var(--violet);
      border-color: var(--violet);
      color: #ffffff;
    }

    .mobile-action-link.login-mobile:hover {
      background: var(--violet);
      border-color: var(--violet);
      color: #ffffff;
    }

    /* ===== RESPONSIVE ===== */
    @media (max-width: 1024px) {
      .nav-links { gap: 20px; }
      .nav-link { font-size: 0.85rem; }
      .nav-link i { font-size: 0.85rem; }
    }

    @media (max-width: 900px) {
      .nav-link span { display: none; }
      .nav-link { font-size: 1.2rem; gap: 0; }
      .nav-link i { font-size: 1.2rem; }
    }

    @media (max-width: 768px) {
      :root { --nav-height: 95px; }
      .nav-container { padding: 0 20px; }
      .nav-links { display: none; }
      .right-actions { display: none; }
      .hamburger { display: flex; }
      .logo-img { height: 75px; }
      .mobile-menu { padding-top: 110px; }
    }

    @media (max-width: 480px) {
      :root { --nav-height: 85px; }
      .nav-container { padding: 0 16px; }
      .logo-img { height: 70px; }
      .mobile-nav-link { font-size: 1rem; padding: 14px 0; }
      .mobile-nav-link i { font-size: 1rem; width: 28px; }
      .mobile-action-link { font-size: 0.95rem; padding: 12px 0; }
      .mobile-menu { padding-top: 100px; }
    }
  </style>
</head>
<body>

  <!-- ===== NAVBAR ===== -->
  <nav class="navbar">
    <div class="nav-container">

      <a href="index.html" class="logo-section">
        <img src="stacklylogo.webp" alt="Stackly Creative Agency" class="logo-img" />
      </a>

      <div class="nav-links">
        <a href="index.html" class="nav-link"><i class="fas fa-house"></i> <span>Home</span></a>
        <a href="work.html" class="nav-link"><i class="fas fa-briefcase"></i> <span>Work</span></a>
        <a href="services.html" class="nav-link"><i class="fas fa-wand-magic-sparkles"></i> <span>Services</span></a>
        <a href="about.html" class="nav-link"><i class="fas fa-circle-info"></i> <span>About</span></a>
        <a href="blog.html" class="nav-link"><i class="fas fa-pen-nib"></i> <span>Blog</span></a>
        <a href="contact.html" class="nav-link"><i class="fas fa-paper-plane"></i> <span>Contact</span></a>
      </div>

      <div class="right-actions">
        <a href="signin.html" class="action-link signin-link"><i class="fas fa-user-plus"></i> Sign In</a>
        <a href="login.html" class="action-link login-link"><i class="fas fa-right-to-bracket"></i> Login</a>
      </div>

      <button class="hamburger" id="hamburgerBtn" aria-label="Toggle menu">
        <span></span><span></span><span></span>
      </button>

    </div>
  </nav>

  <!-- ===== MOBILE MENU ===== -->
  <div class="mobile-menu" id="mobileMenu">
    <div class="mobile-nav-links">
      <a href="index.html" class="mobile-nav-link"><i class="fas fa-house"></i> Home</a>
      <a href="work.html" class="mobile-nav-link"><i class="fas fa-briefcase"></i> Work</a>
      <a href="services.html" class="mobile-nav-link"><i class="fas fa-wand-magic-sparkles"></i> Services</a>
      <a href="about.html" class="mobile-nav-link"><i class="fas fa-circle-info"></i> About</a>
      <a href="blog.html" class="mobile-nav-link"><i class="fas fa-pen-nib"></i> Blog</a>
      <a href="contact.html" class="mobile-nav-link"><i class="fas fa-paper-plane"></i> Contact</a>
    </div>
    <div class="mobile-actions">
      <a href="signin.html" class="mobile-action-link"><i class="fas fa-user-plus"></i> Sign In</a>
      <a href="login.html" class="mobile-action-link login-mobile"><i class="fas fa-right-to-bracket"></i> Login</a>
    </div>
  </div>

  <!-- ===== SCRIPT ===== -->
  <script>
    (function () {
      const btn = document.getElementById('hamburgerBtn');
      const menu = document.getElementById('mobileMenu');

      const toggle = () => {
        btn.classList.toggle('active');
        menu.classList.toggle('active');
        document.body.style.overflow = menu.classList.contains('active') ? 'hidden' : '';
      };
      const close = () => {
        btn.classList.remove('active');
        menu.classList.remove('active');
        document.body.style.overflow = '';
      };

      btn.addEventListener('click', toggle);
      document.querySelectorAll('.mobile-nav-link, .mobile-action-link')
        .forEach(l => l.addEventListener('click', close));
      document.addEventListener('click', e => {
        if (menu.classList.contains('active') &&
            !btn.contains(e.target) && !menu.contains(e.target)) close();
      });
      window.addEventListener('resize', () => { if (window.innerWidth > 768) close(); });
      window.addEventListener('keydown', e => { if (e.key === 'Escape') close(); });
    })();
  </script>

</body>
</html>
