<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Creative Agency- 404 Page Not Found</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Sora:wght@400;600;700;800&family=Playfair+Display:ital,wght@1,600;1,700&display=swap" rel="stylesheet">
  <style>
    /* =========================================================
       STACKLY CREATIVE AGENCY — 404 PAGE
       Paper   #faf7f2  ·  White #ffffff ·  Ink #1a1625
       Violet  #7c3aed  ·  Violet2 #a78bfa ·  Violet3 #f3edff
       Border  #ebe6dd
       ========================================================= */
    :root {
      --paper: #faf7f2;
      --white: #ffffff;
      --ink: #1a1625;
      --ink-2: #4a4358;
      --ink-3: #6f6880;
      --violet: #7c3aed;
      --violet-2: #a78bfa;
      --violet-3: #f3edff;
      --border: #ebe6dd;
      --shadow-hi: 0 28px 70px rgba(26, 22, 37, 0.14);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Inter', 'Segoe UI', Roboto, system-ui, sans-serif;
    }

    body {
      background: var(--paper);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      width: 100%;
      overflow-x: hidden;
      padding: 40px 20px;
      -webkit-font-smoothing: antialiased;
      position: relative;
    }

    /* Background decoration */
    body::before {
      content: '';
      position: fixed;
      top: -200px;
      right: -200px;
      width: 500px;
      height: 500px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(167, 139, 250, 0.18), transparent 70%);
      pointer-events: none;
      z-index: 0;
    }

    body::after {
      content: '';
      position: fixed;
      bottom: -220px;
      left: -180px;
      width: 480px;
      height: 480px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(124, 58, 237, 0.14), transparent 70%);
      pointer-events: none;
      z-index: 0;
    }

    /* ===== MAIN CARD ===== */
    .error-card {
      background: var(--white);
      border: 1px solid var(--border);
      border-radius: 28px;
      box-shadow: var(--shadow-hi);
      max-width: 820px;
      width: 100%;
      padding: 64px 56px;
      text-align: center;
      position: relative;
      z-index: 2;
      overflow: hidden;
    }

    .error-card::after {
      content: '';
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 4px;
      background: linear-gradient(90deg, var(--violet), var(--violet-2));
    }

    /* ===== BADGE ===== */
    .error-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 18px;
      border-radius: 50px;
      background: var(--violet-3);
      border: 1px solid #e3d7ff;
      color: var(--violet);
      font-family: 'Sora', sans-serif;
      font-size: 0.68rem;
      font-weight: 700;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      margin-bottom: 32px;
    }

    .error-badge i {
      font-size: 0.62rem;
      animation: errorPulse 2s ease-in-out infinite;
    }

    @keyframes errorPulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }

    /* ===== 404 NUMBER ===== */
    .error-num {
      font-family: 'Sora', sans-serif;
      font-size: clamp(5rem, 16vw, 11rem);
      font-weight: 800;
      line-height: 0.85;
      letter-spacing: -0.06em;
      color: var(--ink);
      margin-bottom: 24px;
      position: relative;
      display: inline-block;
    }

    .error-num .zero {
      color: transparent;
      -webkit-text-stroke: 3px var(--violet);
      display: inline-block;
      animation: errorSpin 12s linear infinite;
    }

    @keyframes errorSpin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    /* ===== HEADING ===== */
    .error-heading {
      font-family: 'Sora', sans-serif;
      font-size: clamp(1.4rem, 3.4vw, 2rem);
      font-weight: 800;
      color: var(--ink);
      line-height: 1.15;
      letter-spacing: -0.025em;
      margin-bottom: 16px;
    }

    .error-heading em {
      font-family: 'Playfair Display', serif;
      font-style: italic;
      color: var(--violet);
    }

    /* ===== DESCRIPTION ===== */
    .error-desc {
      font-size: 0.98rem;
      color: var(--ink-3);
      line-height: 1.75;
      max-width: 480px;
      margin: 0 auto 40px;
    }

    /* ===== BUTTONS ===== */
    .error-btns {
      display: flex;
      gap: 14px;
      justify-content: center;
      flex-wrap: wrap;
      margin-bottom: 40px;
    }

    .error-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 15px 32px;
      border-radius: 10px;
      font-family: 'Sora', sans-serif;
      font-weight: 700;
      font-size: 0.88rem;
      letter-spacing: 0.01em;
      cursor: pointer;
      transition: all 0.3s ease;
      border: 1.5px solid transparent;
      text-decoration: none;
      white-space: nowrap;
    }

    /* Back to Home — primary violet */
    .error-btn.home {
      background: linear-gradient(135deg, var(--violet), #6d28d9);
      color: #ffffff;
      box-shadow: 0 10px 26px rgba(124, 58, 237, 0.35);
    }

    .error-btn.home:hover {
      background: linear-gradient(135deg, #6d28d9, #5b21b6);
      transform: translateY(-3px);
      box-shadow: 0 16px 34px rgba(124, 58, 237, 0.5);
    }

    /* Go Back — outlined */
    .error-btn.back {
      background: transparent;
      color: var(--ink);
      border-color: rgba(26, 22, 37, 0.22);
    }

    .error-btn.back:hover {
      background: var(--ink);
      color: #ffffff;
      border-color: var(--ink);
      transform: translateY(-3px);
    }

    .error-btn i {
      font-size: 0.85rem;
    }

    /* ===== DIVIDER ===== */
    .error-divider {
      display: flex;
      align-items: center;
      gap: 14px;
      justify-content: center;
      margin-bottom: 28px;
    }

    .error-divider hr {
      flex: 1;
      max-width: 80px;
      border: none;
      height: 1px;
      background: var(--border);
    }

    .error-divider span {
      font-family: 'Sora', sans-serif;
      font-size: 0.66rem;
      font-weight: 700;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--ink-3);
    }

    /* ===== QUICK LINKS ===== */
    .error-links {
      display: flex;
      gap: 10px;
      justify-content: center;
      flex-wrap: wrap;
    }

    .error-link {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 9px 18px;
      border-radius: 50px;
      background: var(--violet-3);
      border: 1px solid transparent;
      color: var(--violet);
      font-family: 'Sora', sans-serif;
      font-size: 0.74rem;
      font-weight: 700;
      letter-spacing: 0.02em;
      text-decoration: none;
      transition: all 0.25s ease;
    }

    .error-link:hover {
      background: var(--violet);
      color: #ffffff;
      border-color: var(--violet);
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(124, 58, 237, 0.28);
    }

    .error-link i {
      font-size: 0.7rem;
    }

    /* ===== BRAND FOOTER ===== */
    .error-brand {
      margin-top: 32px;
      padding-top: 24px;
      border-top: 1px solid var(--border);
      text-align: center;
      font-family: 'Sora', sans-serif;
      font-size: 0.72rem;
      font-weight: 600;
      letter-spacing: 0.08em;
      color: var(--ink-3);
    }

    .error-brand a {
      color: var(--violet);
      font-weight: 700;
      text-decoration: none;
    }

    .error-brand a:hover {
      text-decoration: underline;
    }

    /* ===== RESPONSIVE ===== */
    @media (max-width: 768px) {
      .error-card {
        padding: 48px 32px;
        border-radius: 22px;
      }
      .error-badge {
        font-size: 0.62rem;
        padding: 7px 14px;
        margin-bottom: 24px;
      }
      .error-num {
        margin-bottom: 20px;
      }
      .error-desc {
        font-size: 0.92rem;
        margin-bottom: 32px;
      }
      .error-btns {
        flex-direction: column;
        width: 100%;
        gap: 12px;
      }
      .error-btn {
        width: 100%;
        justify-content: center;
      }
    }

    @media (max-width: 480px) {
      body {
        padding: 24px 16px;
      }
      .error-card {
        padding: 40px 24px;
        border-radius: 20px;
      }
      .error-num {
        font-size: 6rem;
      }
      .error-num .zero {
        -webkit-text-stroke: 2px var(--violet);
      }
      .error-heading {
        font-size: 1.35rem;
      }
      .error-desc {
        font-size: 0.86rem;
      }
      .error-btn {
        padding: 13px 24px;
        font-size: 0.82rem;
      }
      .error-links {
        gap: 8px;
      }
      .error-link {
        font-size: 0.68rem;
        padding: 8px 14px;
      }
      .error-brand {
        font-size: 0.66rem;
      }
    }

    ::-webkit-scrollbar { width: 8px; }
    ::-webkit-scrollbar-track { background: var(--paper); }
    ::-webkit-scrollbar-thumb { background: var(--violet-2); border-radius: 10px; }
    ::-webkit-scrollbar-thumb:hover { background: var(--violet); }
  </style>
</head>
<body>

  <div class="error-card">

    <!-- Badge -->
    <div class="error-badge">
      <i class="fa-solid fa-circle"></i>
      Error 404
    </div>

    <!-- Huge 404 -->
    <div class="error-num">
      4<span class="zero">0</span>4
    </div>

    <!-- Heading -->
    <h1 class="error-heading">
      This page took a <em>creative detour.</em>
    </h1>

    <!-- Description -->
    <p class="error-desc">
      The page you're looking for doesn't exist, was moved, or is still in the studio. Let's get you back on track.
    </p>

    <!-- Buttons -->
    <div class="error-btns">
      <button type="button" class="error-btn back" onclick="goBack()">
        <i class="fa-solid fa-arrow-left"></i>
        Go Back
      </button>
      <a href="index.html" class="error-btn home">
        <i class="fa-solid fa-house"></i>
        Back to Home
      </a>
    </div>

    <!-- Divider -->
    <div class="error-divider">
      <hr />
      <span>Or explore</span>
      <hr />
    </div>

    <!-- Quick Links -->
    <div class="error-links">
      <a href="index.html" class="error-link">
        <i class="fa-solid fa-house"></i> Home
      </a>
      <a href="work.html" class="error-link">
        <i class="fa-solid fa-briefcase"></i> Work
      </a>
      <a href="services.html" class="error-link">
        <i class="fa-solid fa-wand-magic-sparkles"></i> Services
      </a>
      <a href="about.html" class="error-link">
        <i class="fa-solid fa-circle-info"></i> About
      </a>
      <a href="blog.html" class="error-link">
        <i class="fa-solid fa-pen-nib"></i> Blog
      </a>
      <a href="contact.html" class="error-link">
        <i class="fa-solid fa-paper-plane"></i> Contact
      </a>
    </div>

    <!-- Brand -->
    <div class="error-brand">
      © 2026 <a href="index.html">Stackly Creative Agency</a>
    </div>

  </div>

  <script>
    /* ============================================================
       GO BACK — returns to the previous page
       - If history has more than 1 entry → history.back()
       - If user landed here directly (no history) → index.html
       ============================================================ */
    function goBack() {
      try {
        if (window.history.length > 1 && document.referrer) {
          window.history.back();
        } else {
          window.location.href = 'index.html';
        }
      } catch (e) {
        window.location.href = 'index.html';
      }
    }

    /* ============================================================
       KEYBOARD SHORTCUTS
       - B → Go Back
       - H → Back to Home
       ============================================================ */
    document.addEventListener('keydown', function (e) {
      if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
      if (e.key === 'b' || e.key === 'B') {
        e.preventDefault();
        goBack();
      }
      if (e.key === 'h' || e.key === 'H') {
        e.preventDefault();
        window.location.href = 'index.html';
      }
    });

    /* ============================================================
       AUTO-DETECT REFERRER for smarter "Go Back"
       If document.referrer is empty and history is 1 → disable button
       gracefully with a tooltip (optional enhancement)
       ============================================================ */
    window.addEventListener('DOMContentLoaded', function () {
      const backBtn = document.querySelector('.error-btn.back');
      if (!backBtn) return;

      const hasHistory = window.history.length > 1;
      const hasReferrer = !!document.referrer;

      if (!hasHistory && !hasReferrer) {
        backBtn.title = 'No previous page — will go to Home';
      }
    });
  </script>

</body>
</html>
